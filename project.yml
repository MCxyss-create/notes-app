# Описание проекта для XcodeGen.
# Файл NotesApp.xcodeproj НЕ хранится в репозитории — он генерируется
# командой `xcodegen generate` прямо в GitHub Actions.

name: NotesApp

options:
  bundleIdPrefix: com.mysli
  # Русский — основной язык: системные кнопки и календарь тоже будут по-русски.
  developmentLanguage: ru
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  NotesApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NotesApp
    settings:
      base:
        PRODUCT_NAME: NotesApp
        PRODUCT_BUNDLE_IDENTIFIER: com.mysli.notes.k7q2
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Мысли"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # Своя кнопка микрофона: без этих строк iOS закроет приложение при первом нажатии.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Микрофон нужен, чтобы надиктовать запись."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Распознавание речи превращает надиктованное в текст."
        # Фото в записях: камера — снять, «Сохранить изображение» из «Поделиться» — без этой строки упадёт.
        INFOPLIST_KEY_NSCameraUsageDescription: "Камера нужна, чтобы прикрепить фото к записи."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Чтобы сохранить фото из записи в галерею."
        # Календарь: дни рождения из Контактов (остаются на телефоне).
        INFOPLIST_KEY_NSContactsUsageDescription: "Контакты нужны, чтобы взять из них дни рождения."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # «Срочные» уведомления. Сборка без подписи, поэтому в build.yml .app ещё подписывается
        # ad-hoc с этим файлом — иначе разрешение не попадёт в .ipa.
        CODE_SIGN_ENTITLEMENTS: NotesApp/NotesApp.entitlements
        # Подписи в облаке нет: .ipa подписывает iloader бесплатным Apple ID.
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""

  # Автотесты логики: даты, блоки ленты, уведомления. Запускаются в GitHub на виртуальном iPhone.
  NotesAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NotesAppTests
    dependencies:
      - target: NotesApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.mysli.notes.k7q2.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NotesApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/NotesApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""

schemes:
  NotesApp:
    build:
      targets:
        NotesApp: all
    test:
      config: Debug
      targets:
        - NotesAppTests
    run:
      config: Debug
    archive:
      config: Release

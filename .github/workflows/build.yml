# Сборка неподписанного NotesApp.ipa на облачном Mac GitHub + автотесты и снимки экранов.
# Готовый .ipa — вкладка Actions → нужный запуск → Artifacts.
# Логи, ошибки и снимки экранов последнего запуска — ветка ci-results.
# Подпись и установка на iPhone — через iloader на Windows (Import IPA).

name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Версии macOS и Xcode
        run: |
          mkdir -p ci/screens
          { sw_vers; xcodebuild -version; } | tee ci/versions.txt

      - name: Установить XcodeGen
        run: brew install xcodegen

      - name: Сгенерировать проект Xcode
        run: xcodegen generate

      - name: Собрать для iPhone без подписи
        run: |
          if ! xcodebuild \
              -project NotesApp.xcodeproj \
              -scheme NotesApp \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              -quiet \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CURRENT_PROJECT_VERSION=${{ github.run_number }} \
              build > ci/device-build.log 2>&1; then
            echo "Сборка для iPhone упала. Ошибки:"
            grep -E "error:" ci/device-build.log | sort -u | head -40 | tee ci/errors.txt
            grep -E "error:" ci/device-build.log | sort -u | head -10 | sed 's/^/::error::/'
            tail -30 ci/device-build.log
            exit 1
          fi
          echo "Сборка для iPhone прошла. Предупреждений: $(grep -c 'warning:' ci/device-build.log || true)"

      - name: Упаковать в .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/NotesApp.app"
          if [ ! -d "$APP" ]; then
            echo "Не найдено приложение по пути $APP"
            echo "Что есть в папке сборки:"
            ls -la build/Build/Products/ || true
            exit 1
          fi
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          # Сборка без подписи — разрешения (entitlements) внутрь не попадают. Подписываем ad-hoc
          # с ними, чтобы iloader видел «срочные» уведомления; iloader потом переподписывает своим.
          codesign --force --sign - --entitlements NotesApp/NotesApp.entitlements out/Payload/NotesApp.app
          codesign -d --entitlements :- out/Payload/NotesApp.app > ci/entitlements.txt 2>&1 || true
          if grep -q "time-sensitive" ci/entitlements.txt; then
            echo "Разрешение «Срочные уведомления» внутри .ipa"
          else
            echo "::warning::В .ipa нет разрешения time-sensitive — смотри ci/entitlements.txt"
          fi
          (cd out && zip -qry NotesApp.ipa Payload)
          # Команды для Siri и Кнопки действия: без этой папки iOS их не увидит.
          if [ -d "$APP/Metadata.appintents" ]; then
            { echo "Metadata.appintents есть:"; ls -la "$APP/Metadata.appintents"; } | tee ci/appintents.txt
          else
            echo "::warning::В приложении нет Metadata.appintents — команды Siri не появятся" | tee ci/appintents.txt
          fi
          SIZE=$(du -h out/NotesApp.ipa | awk '{print $1}')
          echo "Готово: out/NotesApp.ipa, размер $SIZE, сборка ${{ github.run_number }}"
          {
            echo "## NotesApp.ipa готов"
            echo ""
            echo "- Сборка: **${{ github.run_number }}**"
            echo "- Размер: **$SIZE**"
            echo "- Скачать: блок **Artifacts** ниже на этой странице"
            echo "- Установить: распаковать zip → iloader → Import IPA → выбрать NotesApp.ipa"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Выложить .ipa
        uses: actions/upload-artifact@v4
        with:
          name: NotesApp-build-${{ github.run_number }}
          path: out/NotesApp.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Тесты и снимки экранов на виртуальном iPhone
        env:
          # Необязательно: с этим секретом тесты проверяют 8 контрольных фраз на настоящем DeepSeek.
          TEST_RUNNER_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          SIM=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries
            | map(select(.key | test("iOS")) | select(.value | length > 0))
            | sort_by(.key) | last | .value
            | map(select(.name | startswith("iPhone")))
            | (map(select(.name | test("Pro$"))) + .)
            | .[0].udid // empty')
          if [ -z "$SIM" ]; then
            echo "::error::Не найден виртуальный iPhone"
            xcrun simctl list devices available | tee ci/simulators.txt
            exit 1
          fi
          xcrun simctl list devices available | grep "$SIM" | tee ci/simulator.txt
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b > /dev/null

          if ! xcodebuild build-for-testing \
              -project NotesApp.xcodeproj -scheme NotesApp -configuration Debug \
              -destination "id=$SIM" -derivedDataPath build-sim -quiet \
              CODE_SIGNING_ALLOWED=NO > ci/sim-build.log 2>&1; then
            echo "Сборка для виртуального iPhone упала. Ошибки:"
            grep -E "error:" ci/sim-build.log | sort -u | head -40 | tee ci/errors.txt
            grep -E "error:" ci/sim-build.log | sort -u | head -10 | sed 's/^/::error::/'
            tail -30 ci/sim-build.log
            exit 1
          fi

          TEST_RC=0
          xcodebuild test-without-building \
              -project NotesApp.xcodeproj -scheme NotesApp -configuration Debug \
              -destination "id=$SIM" -derivedDataPath build-sim \
              > ci/tests.log 2>&1 || TEST_RC=$?
          RESULT=$(grep -E "Executed [0-9]+ tests?" ci/tests.log | tail -1 | sed 's/^[[:space:]]*//')
          echo "Тесты: ${RESULT:-нет данных} (код $TEST_RC)"
          if [ "$TEST_RC" != "0" ]; then
            grep -E "error:|failed" ci/tests.log | sort -u | head -40 | tee -a ci/errors.txt
            grep -E "error:" ci/tests.log | sort -u | head -10 | sed 's/^/::error::/'
          fi
          grep -h "AI-CHECK " ci/tests.log | sed 's/^.*AI-CHECK //' > ci/ai-check.txt || true
          [ -s ci/ai-check.txt ] && cat ci/ai-check.txt || rm -f ci/ai-check.txt

          APP="build-sim/Build/Products/Debug-iphonesimulator/NotesApp.app"
          BID="com.mysli.notes.k7q2"
          xcrun simctl install "$SIM" "$APP"
          xcrun simctl status_bar "$SIM" override --time "9:41" --batteryState charged --batteryLevel 100 \
            --wifiBars 3 --cellularBars 4 || true

          shot() {
            xcrun simctl terminate "$SIM" "$BID" > /dev/null 2>&1 || true
            xcrun simctl launch "$SIM" "$BID" -demo "$1" > /dev/null 2>&1 || echo "Не запустилось: $1"
            sleep 5
            if xcrun simctl io "$SIM" screenshot "ci/screens/$2.png" > /dev/null 2>&1; then
              echo "Снимок: $2"
            else
              echo "Снимок не получился: $2"
            fi
          }

          xcrun simctl ui "$SIM" appearance light || true
          shot feed 1-lenta
          shot due 2-kogda-napomnit
          shot edit 3-izmenit
          shot ideas 4-idei
          shot notes 5-zametki
          shot settings 6-nastroiki
          shot empty 7-pusto
          shot review 9-ii-kartochki
          shot inbox 9-vhodyaschie
          shot search 10-poisk
          shot listen 11-slushayu
          shot command 12-komanda
          shot keyboard 13-klaviatura
          shot editKeyboard 14-klaviatura-kartochka
          shot searchKeyboard 15-klaviatura-poisk
          shot urgent 16-srochnye
          shot folders 17-papki
          shot folder 18-papka-vpn
          shot photos 19-foto
          shot viewer 20-foto-ekran
          xcrun simctl ui "$SIM" appearance dark || true
          shot feed 8-lenta-temnaya

          {
            echo "## Тесты"
            echo ""
            echo "${RESULT:-нет данных}"
            if [ -f ci/ai-check.txt ]; then
              echo ""
              echo "## 8 контрольных фраз на DeepSeek"
              echo ""
              sed 's/^/- /' ci/ai-check.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $TEST_RC

      - name: Выложить логи и снимки в ветку ci-results
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci
          cd ci
          echo "${{ github.run_number }}" > run.txt
          echo "${{ github.sha }}" > commit.txt
          git init -q
          git checkout -q -b ci-results
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" \
            commit -qm "Результаты сборки ${{ github.run_number }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-results
          SHA=$(git rev-parse HEAD)
          if ls screens/*.png > /dev/null 2>&1; then
            {
              echo "## Снимки экранов"
              echo ""
              echo "<p>"
              for f in screens/*.png; do
                echo "<img src=\"https://raw.githubusercontent.com/${{ github.repository }}/$SHA/$f\" width=\"200\">"
              done
              echo "</p>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
